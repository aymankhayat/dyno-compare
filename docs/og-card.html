<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyno Compare share card</title>
<!-- Source for assets/og-card.jpg: render at 1200x627 (see CASE_STUDY.md). -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Barlow:wght@500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 627px; overflow: hidden; background: #06080b; }
  .card { position: relative; width: 1200px; height: 627px; font-family: 'Barlow', sans-serif; color: #eef3f1; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url('../assets/render-911.jpg') 62% 60% / 118% auto no-repeat; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #06080b 0%, rgba(6,8,11,0.92) 34%, rgba(6,8,11,0.25) 70%, rgba(6,8,11,0.1) 100%), linear-gradient(0deg, rgba(6,8,11,0.85), transparent 45%); }
  .ring { position: absolute; right: -160px; top: -120px; width: 760px; height: 760px; border-radius: 50%;
    background: conic-gradient(from 200deg, transparent 0 10%, rgba(108,240,194,0.8) 22%, transparent 36%, rgba(90,184,255,0.6) 52%, transparent 62%, rgba(255,90,78,0.9) 72% 78%, transparent 84%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px)); opacity: 0.5; }
  .copy { position: absolute; left: 64px; top: 58px; width: 640px; }
  .eyebrow { font: 600 15px 'JetBrains Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #6cf0c2; margin: 0 0 18px; }
  h1 { margin: 0; font: 800 76px/0.95 'Unbounded', sans-serif; letter-spacing: -0.02em; text-transform: uppercase; }
  .sub { margin: 20px 0 0; font-size: 25px; line-height: 1.35; color: #c4cfcb; width: 560px; }
  .grad { background: linear-gradient(90deg, #6cf0c2, #5ab8ff 55%, #ff5a4e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stats { position: absolute; left: 64px; bottom: 92px; display: flex; gap: 22px; }
  .stat { padding: 14px 20px; border-radius: 16px; background: rgba(15,21,26,0.78); border: 1px solid rgba(255,255,255,0.14); }
  .stat b { display: block; font: 800 40px/1 'Unbounded', sans-serif; }
  .stat span { display: block; margin-top: 8px; font: 400 14px 'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #97a5aa; }
  .credit { position: absolute; left: 64px; bottom: 40px; margin: 0; font: 600 16px 'JetBrains Mono', monospace; letter-spacing: 0.06em; color: #97a5aa; }
  .credit em { font-style: normal; color: #eef3f1; }
</style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="ring"></div>
    <div class="shade"></div>
    <div class="copy">
      <p class="eyebrow">Performance cars, side by side</p>
      <h1>Dyno <span class="grad">Compare</span></h1>
      <p class="sub">A 3D showroom where every figure links to the manufacturer document it came from.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>45</b><span>Maker figures</span></div>
      <div class="stat"><b>6</b><span>3D models in code</span></div>
      <div class="stat"><b>31</b><span>Automated tests</span></div>
    </div>
    <p class="credit">Designed &amp; built by <em>Ayman Khayat</em></p>
  </div>
</body>
</html>
